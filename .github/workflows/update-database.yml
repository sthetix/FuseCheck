name: Auto-Update Database

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    paths:
      - 'scripts/update_db.py'
      - '.github/workflows/update-database.yml'

jobs:
  update-db:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest firmware info from FuseNCA
        id: fetch_firmware
        run: |
          curl -s "https://raw.githubusercontent.com/sthetix/FuseNCA/master/fuses.json" | \
            python3 -c "import sys, json; data=json.load(sys.stdin); versions=[v['version'] for v in data['data']]; print('latest_fw=' + max(versions, key=lambda v: tuple(map(int, v.split('.')))))" >> $GITHUB_OUTPUT

      - name: Generate database from FuseNCA
        run: |
          python3 scripts/update_db.py -o fusecheck_db.txt

      - name: Check for database changes
        id: check_changes
        run: |
          if git diff --quiet fusecheck_db.txt; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No database changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Database changes detected!"
            echo "Latest firmware: ${{ steps.fetch_firmware.outputs.latest_fw }}"
          fi

      - name: Resolve latest release
        id: latest_release
        if: steps.check_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG=$(gh release list --limit 100 --json tagName,isDraft,isPrerelease --jq \
            '[.[] | select(.isDraft == false and .isPrerelease == false) | .tagName | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')

          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "null" ]; then
            echo "No stable semantic-versioned release found"
            exit 1
          fi

          TARGET_ASSET=$(gh release view "$TARGET_TAG" --json assets --jq \
            '[.assets[].name | select(startswith("FuseCheck-") and endswith(".zip"))] | first')

          if [ -z "$TARGET_ASSET" ] || [ "$TARGET_ASSET" = "null" ]; then
            echo "No FuseCheck zip found in release $TARGET_TAG"
            exit 1
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$TARGET_ASSET" >> "$GITHUB_OUTPUT"
          echo "Using release $TARGET_TAG and asset $TARGET_ASSET"

      - name: Update release zip
        if: steps.check_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.latest_release.outputs.tag }}
          TARGET_ASSET: ${{ steps.latest_release.outputs.asset }}
        run: |
          # Download existing release zip
          gh release download "$TARGET_TAG" --dir output_download --pattern "$TARGET_ASSET"

          ZIP_FILE="output_download/$TARGET_ASSET"
          echo "Updating $TARGET_ASSET from release $TARGET_TAG..."

          # Create updated zip
          rm -rf zip_tmp
          mkdir -p zip_tmp/bootloader/payloads
          mkdir -p zip_tmp/config/fusecheck

          # Extract existing zip
          unzip -q "$ZIP_FILE" -d zip_tmp

          # Update with new database
          cp fusecheck_db.txt zip_tmp/config/fusecheck/

          # Rezip
          cd zip_tmp && zip -r "../$TARGET_ASSET" . && cd ..

          echo "Zip created: $(ls -lh "$TARGET_ASSET")"
          rm -rf output_download zip_tmp

      - name: Update release
        if: steps.check_changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.latest_release.outputs.tag }}
          TARGET_ASSET: ${{ steps.latest_release.outputs.asset }}
        run: |
          # Preserve existing release notes and refresh the generated database section
          DATE="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          COUNT=$(grep -c "^\[NCA\]" fusecheck_db.txt || echo "0")
          gh release view "$TARGET_TAG" --json body --jq .body > release_notes.md

          python3 - "${{ steps.fetch_firmware.outputs.latest_fw }}" "$DATE" "$COUNT" << 'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("release_notes.md")
          body = path.read_text()
          start = "<!-- auto-database:start -->"
          end = "<!-- auto-database:end -->"
          block = f"""{start}
          ## Current Database
          - Latest supported firmware: `{sys.argv[1]}`
          - Source: [FuseNCA](https://github.com/sthetix/FuseNCA)
          - Updated: {sys.argv[2]}
          - Supported firmware versions: {sys.argv[3]}
          {end}"""

          if start in body and end in body:
              before, remainder = body.split(start, 1)
              _, after = remainder.split(end, 1)
              body = before.rstrip() + "\n\n" + block + after
          else:
              body = re.sub(r"\n### Database\s*\n.*?(?=\n### |\Z)", "", body, flags=re.DOTALL)
              body = body.rstrip() + "\n\n" + block + "\n"

          path.write_text(body)
          PY

          gh release edit "$TARGET_TAG" --notes-file release_notes.md
          gh release upload "$TARGET_TAG" "$TARGET_ASSET" --clobber

      - name: Commit database changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fusecheck_db.txt
          git commit -m "chore: update database to FW ${{ steps.fetch_firmware.outputs.latest_fw }}"
          git push
